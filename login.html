<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login / Sign Up | Salman Khan Photo Gallery</title>
    <meta name="description" content="Login or create an account to access the Salman Khan Photo Gallery." />

    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />

    <style>
        /* -------------------- Auth Page -------------------- */
        .auth-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(var(--space-lg) + 80px) var(--space-sm) var(--space-lg);
            background:
                    radial-gradient(circle at 20% 20%, var(--color-gold-soft), transparent 45%),
                    radial-gradient(circle at 80% 80%, rgba(107, 20, 32, 0.25), transparent 50%),
                    var(--color-bg);
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: var(--space-md);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .auth-title {
            font-family: var(--font-display);
            font-size: var(--fs-h2);
            color: var(--color-gold-light);
            text-align: center;
            margin-bottom: var(--space-xs);
        }

        .auth-subtitle {
            text-align: center;
            color: var(--color-text-muted);
            font-size: var(--fs-small);
            margin-bottom: var(--space-md);
        }

        .auth-tabs {
            display: flex;
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: var(--space-md);
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 0.75rem;
            background: transparent;
            border: none;
            color: var(--color-text-muted);
            font-family: var(--font-body);
            font-weight: 500;
            font-size: var(--fs-small);
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .auth-tab.active {
            background: var(--color-gold-soft);
            color: var(--color-gold-light);
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
        }

        .auth-form.hidden { display: none; }

        .auth-field {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .auth-field label {
            font-size: var(--fs-small);
            color: var(--color-text-muted);
        }

        .auth-field input {
            background: var(--color-bg-alt);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 0.7rem 0.9rem;
            color: var(--color-text);
            font-family: var(--font-body);
            font-size: var(--fs-body);
            outline: none;
            transition: var(--transition-fast);
        }

        .auth-field input:focus {
            border-color: var(--color-gold);
            box-shadow: 0 0 0 3px var(--color-gold-soft);
        }

        .auth-submit {
            margin-top: var(--space-xs);
            background: var(--color-gold);
            color: #1a1305;
            border: none;
            border-radius: var(--radius);
            padding: 0.8rem;
            font-family: var(--font-body);
            font-weight: 600;
            font-size: var(--fs-body);
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .auth-submit:hover { background: var(--color-gold-light); }
        .auth-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
            margin: var(--space-sm) 0;
            color: var(--color-text-muted);
            font-size: var(--fs-small);
        }

        .auth-divider::before,
        .auth-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--color-border);
        }

        .auth-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: var(--color-bg-elevated);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 0.75rem;
            color: var(--color-text);
            font-family: var(--font-body);
            font-weight: 500;
            font-size: var(--fs-small);
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .auth-google:hover {
            border-color: var(--color-gold);
            background: var(--color-bg-alt);
        }

        .auth-message {
            min-height: 1.4rem;
            text-align: center;
            font-size: var(--fs-small);
            margin-top: var(--space-xs);
        }

        .auth-message.error { color: #e07a7a; }
        .auth-message.success { color: #8fd39a; }

        .auth-loggedin {
            text-align: center;
        }

        .auth-loggedin p {
            color: var(--color-text-muted);
            margin-bottom: var(--space-sm);
        }

        .auth-loggedin strong { color: var(--color-gold-light); }
    </style>
</head>
<body>

<!-- ============ NAVBAR ============ -->
<header class="navbar">
    <a href="index.html" class="logo">SALMAN KHAN</a>

    <nav aria-label="Main navigation">
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="bgm.html">Popular BGM</a></li>
            <li><a href="movies.html">Movies</a></li>
            <li><a href="events.html">Events</a></li>
            <li><a href="old-photos.html">Old Photos</a></li>
            <li><a href="wallpapers.html">Wallpapers</a></li>
            <li><a href="about.html">About</a></li>
            <li id="navAuthItem"><a href="login.html" class="active">Login</a></li>
        </ul>
    </nav>

    <button class="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
        <span></span><span></span><span></span>
    </button>
</header>

<!-- ============ AUTH SECTION ============ -->
<section class="auth-section">
    <div class="auth-card">

        <!-- Shown when user IS logged in -->
        <div id="loggedInView" class="auth-loggedin" hidden>
            <h2 class="auth-title">Welcome back!</h2>
            <p>You're logged in as <strong id="loggedInName"></strong></p>
            <button class="auth-submit" id="logoutBtn">Logout</button>
        </div>

        <!-- Shown when user is NOT logged in -->
        <div id="authView">
            <h2 class="auth-title">Join the Gallery</h2>
            <p class="auth-subtitle">Login or create an account to continue</p>

            <div class="auth-tabs">
                <button class="auth-tab active" id="tabLogin" type="button">Login</button>
                <button class="auth-tab" id="tabSignup" type="button">Sign Up</button>
            </div>

            <!-- ---------- Login form ---------- -->
            <form class="auth-form" id="loginForm">
                <div class="auth-field">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required autocomplete="email" placeholder="you@example.com" />
                </div>
                <div class="auth-field">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required autocomplete="current-password" placeholder="••••••••" />
                </div>
                <button type="submit" class="auth-submit" id="loginSubmit">Login</button>
            </form>

            <!-- ---------- Signup form ---------- -->
            <form class="auth-form hidden" id="signupForm">
                <div class="auth-field">
                    <label for="signupName">Name</label>
                    <input type="text" id="signupName" required autocomplete="name" placeholder="Your name" />
                </div>
                <div class="auth-field">
                    <label for="signupEmail">Email</label>
                    <input type="email" id="signupEmail" required autocomplete="email" placeholder="you@example.com" />
                </div>
                <div class="auth-field">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" required autocomplete="new-password" minlength="6" placeholder="At least 6 characters" />
                </div>
                <button type="submit" class="auth-submit" id="signupSubmit">Create Account</button>
            </form>

            <div class="auth-divider">or</div>

            <button class="auth-google" id="googleBtn" type="button">
                <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 6 29.5 4 24 4 13 4 4 13 4 24s9 20 20 20c11 0 20-9 20-20 0-1.3-.1-2.7-.4-4.5z"/>
                    <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 6 29.5 4 24 4c-7.7 0-14.3 4.4-17.7 10.7z"/>
                    <path fill="#4CAF50" d="M24 44c5.3 0 10.1-1.8 13.8-4.9l-6.4-5.4C29.3 35.4 26.8 36 24 36c-5.2 0-9.6-3.1-11.3-7.6l-6.5 5C9.6 39.6 16.2 44 24 44z"/>
                    <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3-3.5 5.4-6.6 6.7l6.4 5.4C38.8 37.3 44 31.4 44 24c0-1.3-.1-2.7-.4-3.5z"/>
                </svg>
                Continue with Google
            </button>

            <p class="auth-message" id="authMessage"></p>
        </div>
    </div>
</section>

<script type="module">
    import { signup, login, loginWithGoogle, logout, watchAuth, friendlyAuthError } from "./js/auth.js";

    const tabLogin = document.getElementById("tabLogin");
    const tabSignup = document.getElementById("tabSignup");
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");
    const authMessage = document.getElementById("authMessage");
    const authView = document.getElementById("authView");
    const loggedInView = document.getElementById("loggedInView");
    const loggedInName = document.getElementById("loggedInName");

    /* ---------- Tab switching ---------- */
    function showLogin() {
        tabLogin.classList.add("active");
        tabSignup.classList.remove("active");
        loginForm.classList.remove("hidden");
        signupForm.classList.add("hidden");
        setMessage("");
    }

    function showSignup() {
        tabSignup.classList.add("active");
        tabLogin.classList.remove("active");
        signupForm.classList.remove("hidden");
        loginForm.classList.add("hidden");
        setMessage("");
    }

    tabLogin.addEventListener("click", showLogin);
    tabSignup.addEventListener("click", showSignup);

    function setMessage(text, type = "") {
        authMessage.textContent = text;
        authMessage.className = "auth-message" + (type ? " " + type : "");
    }

    /* ---------- Redirect target after login ---------- */
    function goToNext() {
        const params = new URLSearchParams(window.location.search);
        const next = params.get("next");
        const isSafe = next && !next.includes("//") && !next.toLowerCase().startsWith("javascript:");
        window.location.href = isSafe ? next : "index.html";
    }

    /* ---------- Login submit ---------- */
    loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById("loginSubmit");
        submitBtn.disabled = true;
        setMessage("");
        try {
            await login(
                document.getElementById("loginEmail").value.trim(),
                document.getElementById("loginPassword").value
            );
            setMessage("Login successful! Redirecting...", "success");
            setTimeout(goToNext, 800);
        } catch (err) {
            setMessage(friendlyAuthError(err), "error");
        } finally {
            submitBtn.disabled = false;
        }
    });

    /* ---------- Signup submit ---------- */
    signupForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById("signupSubmit");
        submitBtn.disabled = true;
        setMessage("");
        try {
            await signup(
                document.getElementById("signupName").value.trim(),
                document.getElementById("signupEmail").value.trim(),
                document.getElementById("signupPassword").value
            );
            setMessage("Account created! Please check your email to verify your account before logging in.", "success");
            setTimeout(showLogin, 2000);
        } catch (err) {
            setMessage(friendlyAuthError(err), "error");
        } finally {
            submitBtn.disabled = false;
        }
    });

    /* ---------- Google login ---------- */
    document.getElementById("googleBtn").addEventListener("click", async () => {
        setMessage("");
        try {
            await loginWithGoogle();
            setMessage("Login successful! Redirecting...", "success");
            setTimeout(goToNext, 800);
        } catch (err) {
            setMessage(friendlyAuthError(err), "error");
        }
    });

    /* ---------- Logout ---------- */
    document.getElementById("logoutBtn").addEventListener("click", () => {
        logout();
    });

    /* ---------- Show correct view based on auth state ---------- */
    watchAuth((user) => {
        if (user) {
            authView.hidden = true;
            loggedInView.hidden = false;
            loggedInName.textContent = user.displayName || user.email;
        } else {
            authView.hidden = false;
            loggedInView.hidden = true;
        }
    });
</script>

<script src="js/app.js"></script>
</body>
</html>
